# Railway Nixpacks / static SPA
# Set VITE_API_BASE_URL in Railway Variables (build-time).
#
# Do NOT run `npm ci` in buildCommand — Nixpacks already installs deps.
# A second `npm ci` can fail with: EBUSY rmdir node_modules/.cache

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
